<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7efe2">
<title>生日快樂</title>
<style>
  :root{
    --bg:#f8f2e8;
    --ink:#5f4a38;
    --muted:#8c7663;
    --gold:#c9974c;
    --glass:rgba(255,255,255,.78);
    --line:rgba(111,82,49,.15);
    --shadow:0 18px 60px rgba(84,58,34,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  body{overflow:hidden}
  button,input{font:inherit}
  button{cursor:pointer}

  .cover{
    position:fixed;inset:0;z-index:50;
    display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,225,164,.40), transparent 28%),
      radial-gradient(circle at 80% 25%, rgba(240,186,124,.26), transparent 26%),
      linear-gradient(145deg,#fbf5ec,#f4e5d1);
    transition:opacity .9s ease, visibility .9s ease;
  }
  .cover.hide{opacity:0;visibility:hidden}
  .cover-card{
    width:min(92vw,520px);padding:42px 28px 34px;text-align:center;
    border:1px solid rgba(255,255,255,.9);
    background:rgba(255,255,255,.63);
    backdrop-filter:blur(12px);border-radius:30px;box-shadow:var(--shadow);
  }
  .cover-icon{font-size:42px;margin-bottom:8px}
  .cover h1{margin:0;font-size:clamp(34px,8vw,58px);letter-spacing:.08em;font-weight:800}
  .cover p{margin:18px 0 5px;font-size:17px;line-height:1.9}
  .headphone{font-size:14px;color:var(--muted);margin:7px 0 25px}
  .start-btn{
    border:0;border-radius:999px;padding:15px 27px;background:#6f523a;color:#fff;
    font-weight:700;letter-spacing:.06em;box-shadow:0 10px 30px rgba(81,57,36,.24)
  }
  .start-error{min-height:22px;margin-top:14px;color:#a24b43;font-size:13px;line-height:1.6}

  .app{
    position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;
    background:radial-gradient(circle at 50% 0%,#fffaf4 0,#f8f0e4 52%,#efe2cf 100%)
  }
  .stage{position:relative;overflow:hidden;display:grid;place-items:center;padding:22px 20px 10px}
  .photo-wrap{
    position:relative;width:min(94vw,980px);height:min(69vh,760px);
    display:grid;place-items:center;cursor:pointer;user-select:none;touch-action:manipulation
  }
  .photo{
    position:absolute;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
    border-radius:22px;box-shadow:0 22px 70px rgba(76,54,35,.17);
    opacity:0;transform:scale(1.01) translate3d(0,0,0);
    transition:opacity 1.5s ease;will-change:transform,opacity
  }
  .photo.active{opacity:1}
  .photo.movie-a.active{animation:movieA 18s ease-in-out infinite alternate}
  .photo.movie-b.active{animation:movieB 20s ease-in-out infinite alternate}
  @keyframes movieA{
    from{transform:scale(1.01) translate3d(-.5%,.2%,0)}
    to{transform:scale(1.055) translate3d(.7%,-.4%,0)}
  }
  @keyframes movieB{
    from{transform:scale(1.015) translate3d(.6%,.1%,0)}
    to{transform:scale(1.05) translate3d(-.6%,-.3%,0)}
  }

  .tap-hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;
    padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.9);color:#775e49;font-size:13px;
    box-shadow:0 6px 24px rgba(83,59,40,.08);opacity:.9;transition:opacity .5s ease
  }
  .tap-hint.fade{opacity:0;pointer-events:none}

  .sparkles,.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .spark{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(211,165,84,.55);box-shadow:0 0 12px rgba(226,183,103,.8);
    animation:floatUp linear infinite
  }
  @keyframes floatUp{
    from{transform:translateY(18px) scale(.7);opacity:0}
    20%{opacity:.65}80%{opacity:.35}
    to{transform:translateY(-90px) scale(1);opacity:0}
  }

  .caption{
    position:absolute;left:50%;bottom:24px;transform:translate(-50%,16px);
    width:min(88vw,720px);padding:13px 18px;text-align:center;color:#624b37;
    background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);
    border-radius:18px;box-shadow:0 10px 30px rgba(75,53,35,.10);
    opacity:0;transition:opacity .45s ease,transform .45s ease;z-index:6;
    font-size:15px;line-height:1.7
  }
  .caption.show{opacity:1;transform:translate(-50%,0)}

  .blessing{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-42%) scale(.96);
    z-index:15;width:min(82vw,540px);padding:26px 22px;text-align:center;
    border-radius:24px;background:rgba(255,250,242,.94);
    border:1px solid rgba(201,151,76,.24);box-shadow:0 20px 70px rgba(79,53,31,.18);
    opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease
  }
  .blessing.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .blessing .star{font-size:27px;margin-bottom:8px}
  .blessing .text{font-size:20px;line-height:1.75;font-weight:700}

  .surprise{
    position:absolute;inset:0;z-index:18;display:grid;place-items:center;
    padding:26px;background:rgba(67,48,32,.48);opacity:0;visibility:hidden;transition:.5s ease
  }
  .surprise.show{opacity:1;visibility:visible}
  .surprise-card{
    width:min(88vw,480px);text-align:center;padding:30px 24px;background:#fff9ef;
    border-radius:28px;box-shadow:0 25px 80px rgba(38,24,14,.26)
  }
  .surprise-card .gift{font-size:42px}
  .surprise-card h2{margin:8px 0 9px;font-size:24px}
  .surprise-card p{margin:0;line-height:1.9;color:#7e6853}

  .player-shell{padding:10px 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center}
  .player{
    width:min(94vw,900px);padding:13px 14px 12px;border:1px solid rgba(255,255,255,.92);
    background:rgba(255,255,255,.80);box-shadow:0 14px 45px rgba(72,51,34,.13);
    border-radius:24px;backdrop-filter:blur(12px)
  }
  .player-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .sound-badge{
    width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;
    background:#fff6e8;border:1px solid #f2ddbd;font-size:20px
  }
  .now{min-width:0;flex:1}
  .now-title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .wave{display:flex;align-items:center;gap:3px;height:26px}
  .wave i{display:block;width:3px;border-radius:4px;background:var(--gold);height:7px;animation:wave 1s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  .paused .wave i{animation-play-state:paused}
  @keyframes wave{50%{height:20px}}

  .progress-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .time{font-variant-numeric:tabular-nums;font-size:12px;color:#806b58;min-width:38px;text-align:center}
  .seek{width:100%;accent-color:#b98640;cursor:pointer}
  .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:9px}
  .control{
    border:0;background:#f5ead9;color:#6f523a;min-width:44px;height:40px;
    border-radius:14px;padding:0 12px;font-weight:800
  }
  .control.main{
    width:52px;height:52px;border-radius:50%;background:#6f523a;color:white;
    font-size:20px;box-shadow:0 8px 22px rgba(81,58,39,.20)
  }
  .control.small{font-size:12px}
  .volume-wrap{display:flex;align-items:center;gap:6px;margin-left:4px}
  .volume{width:70px;accent-color:#b98640}

  .ending{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
    background:linear-gradient(150deg,#4b3524,#261c16);color:#fff;text-align:center;
    opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s ease
  }
  .ending.show{opacity:1;visibility:visible}
  .ending-inner{position:relative;z-index:4;width:min(90vw,680px)}
  .ending-small{font-size:16px;opacity:.8;letter-spacing:.04em}
  .ending h2{font-size:clamp(40px,10vw,76px);margin:18px 0 10px;line-height:1.12;letter-spacing:.04em}
  .ending p{margin:0 auto 24px;max-width:560px;line-height:1.9;color:#f0dfc7}
  .replay{
    border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);
    color:#fff;padding:13px 22px;border-radius:999px;font-weight:700
  }
  .confetti{
    position:absolute;top:-30px;width:9px;height:16px;border-radius:2px;
    animation:fall linear forwards
  }
  @keyframes fall{
    to{transform:translate3d(var(--dx),110vh,0) rotate(760deg);opacity:.85}
  }

  @media (max-width:680px){
    .stage{padding:14px 10px 4px}
    .photo-wrap{width:96vw;height:64vh}
    .photo{border-radius:16px}
    .caption{bottom:10px;font-size:14px}
    .player-shell{padding-left:8px;padding-right:8px}
    .player{width:98vw;border-radius:20px}
    .volume-wrap{display:none}
    .controls{gap:8px}
    .control{min-width:42px;padding:0 10px}
  }
</style>
</head>
<body>

<audio id="audio" src="./老虎.m4a" preload="metadata"></audio>

<div id="cover" class="cover">
  <div class="cover-card">
    <div class="cover-icon">🎂</div>
    <h1>生日快樂</h1>
    <p>有一份生日祝福，想讓你慢慢聽完。</p>
    <div class="headphone">🎧 建議戴上耳機，感受會更完整</div>
    <button id="startBtn" class="start-btn">開啟生日祝福</button>
    <div id="startError" class="start-error"></div>
  </div>
</div>

<main class="app">
  <section class="stage">
    <div id="sparkles" class="sparkles"></div>

    <div id="photoWrap" class="photo-wrap" aria-label="生日照片，點一下可收下祝福">
      <div id="tapHint" class="tap-hint">點一下照片，收下一句生日祝福 ✨</div>
      <img id="photo1" class="photo movie-a active" src="./生日快樂.PNG" alt="生日祝福圖片 1">
      <img id="photo2" class="photo movie-b" src="./生日快樂.JPG" alt="生日祝福圖片 2">
      <div id="caption" class="caption"></div>

      <div id="blessing" class="blessing">
        <div class="star">✨</div>
        <div id="blessingText" class="text"></div>
      </div>
    </div>

    <div id="surprise" class="surprise">
      <div class="surprise-card">
        <div class="gift">🎁</div>
        <h2>偷偷送你一份生日好運</h2>
        <p>願接下來的日子，多一點好運、多一點快樂，也多一點喜歡自己的時刻。</p>
      </div>
    </div>
  </section>

  <section class="player-shell">
    <div id="player" class="player paused">
      <div class="player-top">
        <div class="sound-badge">🎧</div>
        <div class="now">
          <div class="now-title">正在播放一份給你的生日祝福</div>
          <div id="statusText" class="now-sub">準備播放</div>
        </div>
        <div class="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="progress-row">
        <div id="currentTime" class="time">0:00</div>
        <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="播放進度">
        <div id="duration" class="time">--:--</div>
      </div>

      <div class="controls">
        <button id="backBtn" class="control small" title="倒退 10 秒">↶ 10秒</button>
        <button id="playBtn" class="control main" title="播放 / 暫停">▶</button>
        <button id="forwardBtn" class="control small" title="快轉 10 秒">10秒 ↷</button>
        <div class="volume-wrap">
          <span>🔊</span>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
        </div>
      </div>
    </div>
  </section>
</main>

<section id="ending" class="ending">
  <div id="confettiLayer" class="confetti-layer"></div>
  <div class="ending-inner">
    <div class="ending-small">最後，送你今天最重要的一句話。</div>
    <h2>HAPPY BIRTHDAY 🎂</h2>
    <p>願這段祝福，陪你迎接新的一歲。願平安、快樂與值得期待的事情，都慢慢向你靠近。</p>
    <button id="replayBtn" class="replay">↻ 再聽一次</button>
  </div>
</section>

<script>
(() => {
  const audio = document.getElementById('audio');
  const cover = document.getElementById('cover');
  const startBtn = document.getElementById('startBtn');
  const startError = document.getElementById('startError');
  const player = document.getElementById('player');
  const playBtn = document.getElementById('playBtn');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const volume = document.getElementById('volume');
  const seek = document.getElementById('seek');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const statusText = document.getElementById('statusText');
  const photoWrap = document.getElementById('photoWrap');
  const photo1 = document.getElementById('photo1');
  const photo2 = document.getElementById('photo2');
  const caption = document.getElementById('caption');
  const tapHint = document.getElementById('tapHint');
  const blessing = document.getElementById('blessing');
  const blessingText = document.getElementById('blessingText');
  const surprise = document.getElementById('surprise');
  const ending = document.getElementById('ending');
  const replayBtn = document.getElementById('replayBtn');
  const confettiLayer = document.getElementById('confettiLayer');
  const sparkles = document.getElementById('sparkles');

  let surpriseShown = false;
  let endingShown = false;
  let blessingTimer = null;
  let lastCaptionIndex = -1;

  const blessings = [
    '願新的一歲，平安順心，好運常在。',
    '願每個平凡的日子，都藏著小小驚喜。',
    '願笑容比煩惱多，期待比遺憾多。',
    '願想做的事情，都一步一步靠近。',
    '願生活有光，心裡有暖，身邊有值得珍惜的人事物。',
    '願新的這一歲，比去年多一點自在，也多一點快樂。',
    '願所有努力，都在適合的時候開花結果。',
    '願今天收到的祝福，陪你很久很久。'
  ];

  const captions = [
    {from:.07, to:.12, text:'今天，請把一些時間留給自己。'},
    {from:.24, to:.30, text:'願接下來的日子，有更多值得期待的事情。'},
    {from:.43, to:.49, text:'新的一歲，也要記得好好照顧自己。'},
    {from:.76, to:.82, text:'願笑容比煩惱多，喜歡的事情也越來越多。'}
  ];

  function formatTime(sec){
    if(!Number.isFinite(sec)) return '--:--';
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function setPlayingUI(){
    const playing = !audio.paused && !audio.ended;
    player.classList.toggle('paused', !playing);
    playBtn.textContent = playing ? 'Ⅱ' : '▶';
    statusText.textContent = playing ? '播放中 · 可拖曳進度或倒退 10 秒' : '已暫停 · 想重聽可直接拖曳';
  }

  function syncByProgress(p){
    const useSecond = p >= .50;
    photo1.classList.toggle('active', !useSecond);
    photo2.classList.toggle('active', useSecond);

    let matched = -1;
    for(let i=0;i<captions.length;i++){
      if(p >= captions[i].from && p <= captions[i].to){ matched = i; break; }
    }
    if(matched !== lastCaptionIndex){
      lastCaptionIndex = matched;
      if(matched >= 0){
        caption.textContent = captions[matched].text;
        caption.classList.add('show');
      }else caption.classList.remove('show');
    }

    if(p >= .64 && p < .72 && !surpriseShown){
      surpriseShown = true;
      surprise.classList.add('show');
      setTimeout(()=>surprise.classList.remove('show'), 4200);
    }

    if(audio.duration){
      const remain = audio.duration - audio.currentTime;
      if((remain <= 18 || p >= .965) && !endingShown && audio.currentTime > 0) showEnding();
    }
  }

  function updateUI(){
    const d = audio.duration, t = audio.currentTime;
    currentTimeEl.textContent = formatTime(t);
    durationEl.textContent = formatTime(d);
    if(Number.isFinite(d) && d > 0){
      const p = t/d;
      seek.value = Math.round(p*1000);
      syncByProgress(p);
    }
  }

  async function playAudio(){
    audio.muted = false;
    audio.volume = Number(volume.value);
    try{
      await audio.play();
      setPlayingUI();
      startError.textContent = '';
    }catch(err){
      setPlayingUI();
      startError.textContent = '音檔無法播放。請確認「老虎.m4a」與 index.html 位於同一個 GitHub 資料夾，且檔名完全一致。';
      throw err;
    }
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = '正在開啟…';
    try{
      await playAudio();
      cover.classList.add('hide');
      setTimeout(()=>tapHint.classList.add('fade'), 6500);
    }catch(e){
      startBtn.disabled = false;
      startBtn.textContent = '開啟生日祝福';
    }
  });

  playBtn.addEventListener('click', async () => {
    if(audio.paused){ try{ await playAudio(); }catch(e){} }
    else audio.pause();
  });

  backBtn.addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10); updateUI();
  });

  forwardBtn.addEventListener('click', () => {
    if(Number.isFinite(audio.duration)){
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); updateUI();
    }
  });

  seek.addEventListener('input', () => {
    if(Number.isFinite(audio.duration)){
      audio.currentTime = (Number(seek.value)/1000) * audio.duration; updateUI();
    }
  });

  volume.addEventListener('input', () => {
    audio.volume = Number(volume.value); audio.muted = audio.volume === 0;
  });

  audio.addEventListener('loadedmetadata', () => durationEl.textContent = formatTime(audio.duration));
  audio.addEventListener('timeupdate', updateUI);
  audio.addEventListener('play', setPlayingUI);
  audio.addEventListener('pause', setPlayingUI);
  audio.addEventListener('ended', showEnding);
  audio.addEventListener('error', () => {
    startError.textContent = '找不到音檔「老虎.m4a」。請確認它和 index.html 位於同一個 GitHub 資料夾。';
  });

  function showBlessing(){
    tapHint.classList.add('fade');
    clearTimeout(blessingTimer);
    blessingText.textContent = blessings[Math.floor(Math.random()*blessings.length)];
    blessing.classList.add('show');
    blessingTimer = setTimeout(()=>blessing.classList.remove('show'), 3200);
  }

  photoWrap.addEventListener('click', (e) => {
    if(e.target.closest('.caption') || e.target.closest('.blessing')) return;
    showBlessing();
  });

  function showEnding(){
    if(endingShown) return;
    endingShown = true;
    ending.classList.add('show');
    makeConfetti(46);
  }

  replayBtn.addEventListener('click', async () => {
    ending.classList.remove('show');
    confettiLayer.innerHTML = '';
    endingShown = false;
    surpriseShown = false;
    audio.currentTime = 0;
    seek.value = 0;
    photo1.classList.add('active');
    photo2.classList.remove('active');
    try{ await playAudio(); }catch(e){}
  });

  function makeConfetti(count){
    const colors = ['#f7d36b','#f0b36d','#f7a3b8','#fff1c7','#e8a8a0','#b6d3c2'];
    for(let i=0;i<count;i++){
      const el = document.createElement('i');
      el.className = 'confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.setProperty('--dx', (Math.random()*160-80) + 'px');
      el.style.animationDuration = (4.8 + Math.random()*3.2) + 's';
      el.style.animationDelay = (Math.random()*1.8) + 's';
      confettiLayer.appendChild(el);
    }
  }

  function makeSparkles(){
    for(let i=0;i<18;i++){
      const s = document.createElement('i');
      s.className = 'spark';
      s.style.left = (4 + Math.random()*92) + '%';
      s.style.top = (12 + Math.random()*82) + '%';
      s.style.animationDuration = (6 + Math.random()*8) + 's';
      s.style.animationDelay = (-Math.random()*10) + 's';
      s.style.opacity = (.18 + Math.random()*.36).toFixed(2);
      sparkles.appendChild(s);
    }
  }

  makeSparkles();
  setPlayingUI();
})();
</script>
</body>
</html>
