<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5e6cf" />
  <title>生日快樂｜專屬生日祝福</title>
  <style>
    :root{
      --bg:#f8f1e7;
      --text:#5c4737;
      --muted:#8b7667;
      --card:rgba(255,255,255,.76);
      --line:rgba(255,255,255,.75);
      --shadow:0 20px 60px rgba(78,51,29,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);overflow:hidden}
    button{font:inherit}

    .app{position:relative;width:100%;height:100%;isolation:isolate;background:#eadcc8}
    .bg{
      position:absolute;inset:-5%;z-index:-3;
      background:center/cover no-repeat;
      filter:blur(26px) brightness(.9) saturate(.95);
      transform:scale(1.12);
      transition:background-image 1.6s ease, filter 1.2s ease;
    }
    .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,239,.2),rgba(69,42,24,.16))}

    .grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.95) .7px,transparent .8px);background-size:9px 9px;mix-blend-mode:soft-light}
    .vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle at 50% 45%,transparent 48%,rgba(65,38,20,.18) 130%)}

    .screen{position:absolute;inset:0;display:grid;place-items:center;padding:22px;transition:opacity .8s ease,visibility .8s ease}
    .hidden{opacity:0;visibility:hidden;pointer-events:none}

    .intro{z-index:10;background:linear-gradient(180deg,rgba(255,248,240,.42),rgba(110,75,45,.22));backdrop-filter:blur(4px)}
    .intro-card{width:min(520px,92vw);padding:34px 26px 30px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:var(--shadow);text-align:center;backdrop-filter:blur(15px)}
    .tiny{font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
    h1{margin:0 0 14px;font-size:clamp(31px,8vw,52px);font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;letter-spacing:.06em}
    .sub{margin:0 auto 24px;max-width:390px;line-height:1.85;color:#6f5a4a;font-size:15px}
    .headphone{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.64);font-size:13px;color:#7c6758;margin-bottom:18px}
    .start-btn{appearance:none;border:none;border-radius:999px;padding:15px 28px;min-width:220px;background:#5d4636;color:white;font-weight:700;letter-spacing:.06em;box-shadow:0 10px 30px rgba(63,42,27,.24);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
    .start-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(63,42,27,.30)}
    .start-btn:active{transform:scale(.98)}

    .stage{position:absolute;inset:0;display:grid;place-items:center;padding:20px 20px 108px}
    .photo-wrap{position:relative;width:min(1080px,94vw);height:min(72vh,760px);display:grid;place-items:center}
    .photo{
      position:absolute;max-width:100%;max-height:100%;object-fit:contain;border-radius:24px;
      box-shadow:0 22px 70px rgba(50,28,14,.26);
      opacity:0;transform:scale(1.02);transition:opacity 1.7s ease,transform 10s ease;
      user-select:none;-webkit-user-drag:none;background:rgba(255,255,255,.18)
    }
    .photo.active{opacity:1;transform:scale(1.075)}
    .photo.second.active{transform:scale(1.055) translateY(-.4%)}

    .sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .spark{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,248,204,.9);box-shadow:0 0 14px rgba(255,244,178,.95);animation:floatUp 9s linear infinite;opacity:0}
    @keyframes floatUp{0%{transform:translateY(20px) scale(.5);opacity:0}15%{opacity:.85}80%{opacity:.45}100%{transform:translateY(-120px) scale(1.2);opacity:0}}

    .caption{position:absolute;left:50%;bottom:122px;transform:translateX(-50%) translateY(12px);width:min(90vw,760px);padding:13px 18px;border-radius:18px;background:rgba(255,255,255,.70);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(10px);box-shadow:0 12px 32px rgba(62,37,23,.12);text-align:center;font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(15px,4vw,20px);letter-spacing:.04em;opacity:0;transition:opacity .8s ease,transform .8s ease;pointer-events:none}
    .caption.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .player{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,92vw);padding:14px 16px 15px;border-radius:22px;background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.82);box-shadow:0 14px 40px rgba(61,40,25,.18);backdrop-filter:blur(15px);z-index:6}
    .player-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .play-btn{width:38px;height:38px;border:none;border-radius:50%;background:#5d4636;color:white;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
    .now{min-width:0;flex:1}
    .now-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .now-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .bars{display:flex;align-items:end;gap:3px;height:24px;width:44px;justify-content:center}
    .bar{width:3px;height:7px;border-radius:99px;background:#876b58;animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused;opacity:.72}
    .playing .bar{animation-play-state:running}
    .bar:nth-child(2){animation-delay:.15s}.bar:nth-child(3){animation-delay:.3s}.bar:nth-child(4){animation-delay:.05s}.bar:nth-child(5){animation-delay:.22s}
    @keyframes eq{from{height:6px}to{height:22px}}
    .progress-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;font-size:11px;color:#796556}
    .track{height:5px;border-radius:999px;background:rgba(87,66,51,.16);overflow:hidden;cursor:pointer;position:relative}
    .fill{height:100%;width:0;background:#6b5241;border-radius:inherit}

    .ending{z-index:12;background:rgba(69,44,29,.42);backdrop-filter:blur(8px)}
    .ending-card{width:min(500px,90vw);text-align:center;padding:34px 24px;border-radius:28px;background:rgba(255,251,246,.9);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8)}
    .ending-card .eyebrow{font-size:13px;letter-spacing:.15em;color:#8b7667;margin-bottom:10px}
    .ending-card h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(38px,11vw,66px);margin:0 0 10px;letter-spacing:.08em}
    .ending-card p{margin:0 0 22px;color:#735e50;line-height:1.7}
    .again{border:1px solid rgba(93,70,54,.24);background:white;color:#5d4636;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer}

    .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .confetti i{position:absolute;top:-12%;width:8px;height:16px;border-radius:2px;opacity:.86;animation:fall 5.5s linear forwards}
    @keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(720deg)}}

    @media (max-width:720px){
      .stage{padding:14px 10px 108px}
      .photo-wrap{width:96vw;height:68vh}
      .photo{border-radius:18px}
      .caption{bottom:116px;font-size:15px;padding:11px 14px}
      .intro-card{padding:30px 20px 26px}
    }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.2s!important}
      .photo.active{transform:none}
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="bg" id="bg"></div>
    <div class="grain"></div>
    <div class="sparkles" id="sparkles"></div>
    <div class="vignette"></div>

    <section class="screen intro" id="intro">
      <div class="intro-card">
        <div class="tiny">A little birthday surprise</div>
        <h1>生日快樂</h1>
        <p class="sub">有一份生日祝福，想讓你慢慢聽完。</p>
        <div class="headphone">🎧 建議戴上耳機</div><br />
        <button class="start-btn" id="startBtn">開啟生日祝福</button>
      </div>
    </section>

    <section class="stage" id="stage" aria-live="polite">
      <div class="photo-wrap">
        <img id="photo1" class="photo first active" alt="生日祝福圖片 1" />
        <img id="photo2" class="photo second" alt="生日祝福圖片 2" />
      </div>
      <div class="caption" id="caption"></div>
    </section>

    <section class="player" id="player">
      <div class="player-top">
        <button class="play-btn" id="playBtn" aria-label="播放或暫停">▶</button>
        <div class="now">
          <div class="now-title">正在播放一份給你的生日祝福</div>
          <div class="now-sub">慢慢聽，這幾分鐘是特別留給你的。</div>
        </div>
        <div class="bars" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </div>
      <div class="progress-row">
        <span id="current">0:00</span>
        <div class="track" id="track" aria-label="音訊進度"><div class="fill" id="fill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </section>

    <section class="screen ending hidden" id="ending">
      <div class="confetti" id="confetti"></div>
      <div class="ending-card">
        <div class="eyebrow">最後，送你今天最重要的一句話</div>
        <h2>生日快樂 🎂</h2>
        <p>願這段祝福，陪你迎接新的一歲。</p>
        <button class="again" id="againBtn">↻ 再聽一次</button>
      </div>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script>
    // ===== 此客戶素材已直接帶入，不需再修改 =====
    const MEDIA = {
      image1: 'https://drive.google.com/uc?export=view&id=1Y7KzoFhYW5VRgTulzJdeY5Jgv_5z7uS_',
      image2: 'https://drive.google.com/uc?export=view&id=1k6zrWmi5CMFw9GJ8goPyPS9R3Q_0Bns1',
      audio:  'https://drive.google.com/uc?export=download&id=1-KSYEJsA1041b_q4fCIAAJm100Ulf8kU'
    };

    const app = document.getElementById('app');
    const bg = document.getElementById('bg');
    const intro = document.getElementById('intro');
    const startBtn = document.getElementById('startBtn');
    const playBtn = document.getElementById('playBtn');
    const player = document.getElementById('player');
    const audio = document.getElementById('audio');
    const photo1 = document.getElementById('photo1');
    const photo2 = document.getElementById('photo2');
    const caption = document.getElementById('caption');
    const current = document.getElementById('current');
    const duration = document.getElementById('duration');
    const fill = document.getElementById('fill');
    const track = document.getElementById('track');
    const ending = document.getElementById('ending');
    const againBtn = document.getElementById('againBtn');
    const sparkles = document.getElementById('sparkles');

    // 直接載入此客戶素材；圖片若 Drive 直連失敗，會自動切換備援網址
    const IMAGE1_FALLBACK = 'https://lh3.googleusercontent.com/d/1Y7KzoFhYW5VRgTulzJdeY5Jgv_5z7uS_=w2000';
    const IMAGE2_FALLBACK = 'https://lh3.googleusercontent.com/d/1k6zrWmi5CMFw9GJ8goPyPS9R3Q_0Bns1=w2000';
    const AUDIO_FALLBACK  = 'https://drive.usercontent.google.com/download?id=1-KSYEJsA1041b_q4fCIAAJm100Ulf8kU&export=download&confirm=t';

    photo1.src = MEDIA.image1;
    photo2.src = MEDIA.image2;
    audio.src = MEDIA.audio;
    bg.style.backgroundImage = `url("${MEDIA.image1}")`;

    photo1.addEventListener('error',()=>{ if(photo1.src !== IMAGE1_FALLBACK) photo1.src = IMAGE1_FALLBACK; });
    photo2.addEventListener('error',()=>{ if(photo2.src !== IMAGE2_FALLBACK) photo2.src = IMAGE2_FALLBACK; });
    audio.addEventListener('error',()=>{
      if(audio.src !== AUDIO_FALLBACK){
        const t = audio.currentTime || 0;
        audio.src = AUDIO_FALLBACK;
        audio.currentTime = t;
      }
    }, { once:true });

    // 少量通用祝福，不預設送禮人與壽星關係
    const messages = [
      { p: .12, text: '今天，請把一些時間留給自己。' },
      { p: .30, text: '願接下來的日子，有更多值得期待的事情。' },
      { p: .52, text: '新的一歲，也要記得好好照顧自己。' },
      { p: .72, text: '願你被溫柔對待，也保有喜歡生活的方式。' },
      { p: .88, text: '最後一點點了，繼續聽下去吧。' }
    ];
    let shownMessage = -1;
    let switched = false;
    let endedShown = false;

    function fmt(sec){
      if(!Number.isFinite(sec)) return '0:00';
      const m = Math.floor(sec/60);
      const s = Math.floor(sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function setPlayingUI(isPlaying){
      playBtn.textContent = isPlaying ? 'Ⅱ' : '▶';
      player.classList.toggle('playing', isPlaying);
    }

    async function startExperience(){
      intro.classList.add('hidden');
      try{
        await audio.play();
        setPlayingUI(true);
      }catch(err){
        console.warn('Audio play blocked or unavailable:', err);
        setPlayingUI(false);
      }
    }

    startBtn.addEventListener('click', startExperience);

    playBtn.addEventListener('click', async()=>{
      if(audio.paused){
        try{ await audio.play(); setPlayingUI(true); }catch(e){ console.warn(e); }
      }else{
        audio.pause(); setPlayingUI(false);
      }
    });

    audio.addEventListener('loadedmetadata',()=>{
      duration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('play',()=>setPlayingUI(true));
    audio.addEventListener('pause',()=>setPlayingUI(false));

    audio.addEventListener('timeupdate',()=>{
      if(!audio.duration) return;
      const p = audio.currentTime / audio.duration;
      current.textContent = fmt(audio.currentTime);
      duration.textContent = fmt(audio.duration);
      fill.style.width = `${Math.min(100,p*100)}%`;

      // 約 45% 時切換第二張圖
      if(p >= .45 && !switched){
        switched = true;
        photo1.classList.remove('active');
        photo2.classList.add('active');
        bg.style.backgroundImage = `url("${MEDIA.image2}")`;
      } else if(p < .45 && switched){
        switched = false;
        photo2.classList.remove('active');
        photo1.classList.add('active');
        bg.style.backgroundImage = `url("${MEDIA.image1}")`;
      }

      // 文字提示，每句顯示約 6% 音訊長度
      let idx = -1;
      for(let i=0;i<messages.length;i++){
        if(p >= messages[i].p && p < messages[i].p + .06){ idx = i; break; }
      }
      if(idx !== -1){
        if(shownMessage !== idx){
          shownMessage = idx;
          caption.textContent = messages[idx].text;
        }
        caption.classList.add('show');
      }else{
        caption.classList.remove('show');
      }

      // 最後約 3% 顯示生日結尾
      if(p >= .97 && !endedShown){
        endedShown = true;
        showEnding();
      }
    });

    track.addEventListener('click',(e)=>{
      if(!audio.duration) return;
      const rect = track.getBoundingClientRect();
      const ratio = Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
      audio.currentTime = ratio*audio.duration;
    });

    audio.addEventListener('ended',()=>{
      setPlayingUI(false);
      showEnding();
    });

    againBtn.addEventListener('click', async()=>{
      ending.classList.add('hidden');
      endedShown = false;
      shownMessage = -1;
      switched = false;
      caption.classList.remove('show');
      photo2.classList.remove('active');
      photo1.classList.add('active');
      bg.style.backgroundImage = `url("${MEDIA.image1}")`;
      audio.currentTime = 0;
      try{ await audio.play(); setPlayingUI(true); }catch(e){ console.warn(e); }
    });

    function showEnding(){
      ending.classList.remove('hidden');
      makeConfetti();
    }

    function makeConfetti(){
      const wrap = document.getElementById('confetti');
      wrap.innerHTML = '';
      const colors = ['#f2c14e','#f59ca9','#9cc5d8','#c9b6e4','#fff1c7'];
      for(let i=0;i<48;i++){
        const piece = document.createElement('i');
        piece.style.left = Math.random()*100+'%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay = (Math.random()*1.5)+'s';
        piece.style.animationDuration = (4.4+Math.random()*2.6)+'s';
        piece.style.setProperty('--drift', `${-70 + Math.random()*140}px`);
        wrap.appendChild(piece);
      }
    }

    // 背景微光粒子
    for(let i=0;i<16;i++){
      const s = document.createElement('span');
      s.className='spark';
      s.style.left=(5+Math.random()*90)+'%';
      s.style.top=(25+Math.random()*65)+'%';
      s.style.animationDelay=(Math.random()*8)+'s';
      s.style.animationDuration=(7+Math.random()*7)+'s';
      sparkles.appendChild(s);
    }
  </script>
</body>
</html>
